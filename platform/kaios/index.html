<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, height=320, initial-scale=1, user-scalable=no">
<title>Quake II</title>
<style>
	html, body {
		margin: 0;
		padding: 0;
		width: 240px;
		height: 320px;
		background: #000;
		color: #ccc;
		font-family: sans-serif;
		font-size: 13px;
		overflow: hidden;
	}
	#menu, #picker, #settings, #status {
		box-sizing: border-box;
		position: absolute;
		top: 0;
		left: 0;
		z-index: 10;
		width: 240px;
		height: 320px;
		padding: 8px;
		background: #000;
	}
	#menu h1, #picker h1, #settings h1 {
		font-size: 15px;
		margin: 0 0 8px 0;
		color: #fff;
	}
	#menu ul, #picker ul, #settings ul {
		list-style: none;
		margin: 0;
		padding: 0;
		/* Leaves room for the h1 above and the hint bar below within the
		 * fixed 320px-tall screen -- overflow-y lets a list longer than
		 * that (the Debug settings screen has 13+ rows) scroll instead
		 * of just clipping with no way to reach the rest via keyboard
		 * nav. Paired with li.selected's scrollIntoView() call in
		 * app.js's renderMenuItems(). */
		max-height: 250px;
		overflow-y: auto;
	}
	#menu li, #picker li, #settings li {
		padding: 4px 4px 4px 16px;
		position: relative;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	/* Quake II's own menu marks the selected row with a cursor glyph to
	 * its left and a distinct text color, not a solid highlight block --
	 * same idea here, kept in this launcher's existing palette (the
	 * accent blue already used for the status/progress bar) instead of
	 * Quake II's yellow. */
	#menu li.selected, #picker li.selected, #settings li.selected {
		color: #6cf;
	}
	#menu li.selected::before, #picker li.selected::before, #settings li.selected::before {
		content: '\25B8';
		position: absolute;
		left: 2px;
		color: #6cf;
	}
	/* Play before baseq2 has ever been found -- greyed out and
	   non-actionable (see app.js's showMainMenu()), with #menu-caption
	   underneath explaining why. */
	#menu li.disabled {
		color: #555;
	}
	#menu li.disabled.selected {
		color: #789;
	}
	#menu li.disabled.selected::before {
		color: #789;
	}
	#menu-caption {
		font-size: 11px;
		color: #888;
		padding: 2px 4px 0 16px;
		min-height: 13px;
	}
	#menu .hint, #picker .hint, #settings .hint, #status .hint {
		position: absolute;
		bottom: 6px;
		left: 8px;
		right: 8px;
		font-size: 11px;
		color: #888;
	}
	#picker, #settings, #status {
		display: none;
	}
	#status .bar {
		margin-top: 10px;
		height: 10px;
		border: 1px solid #666;
	}
	#status .bar > div {
		height: 100%;
		width: 0%;
		background: #35c;
	}
	#canvas {
		/* Always laid out (display:block from first paint), covered by
		 * #picker/#status sitting on top via z-index -- not toggled with
		 * display:none/block like those are. Matches this project's own
		 * ClassiCube KaiOS build (confirmed working WebGL on this exact
		 * device): its canvas is display:block from the start too, under
		 * a separate #loading-overlay div. A canvas that's never actually
		 * been laid out before WebGL context creation is plausible as a
		 * factor on this device's old Gecko engine, given how many other
		 * WebGL-specific quirks it's already shown this session. */
		display: block;
		position: absolute;
		top: 0;
		left: 0;
		width: 240px;
		height: 320px;
		background: #000;
	}
</style>
</head>
<body>

<div id="menu">
	<h1>Quake II</h1>
	<ul id="menu-list"></ul>
	<div id="menu-caption"></div>
	<div class="hint">OK: select</div>
</div>

<div id="picker">
	<h1>Select baseq2 folder</h1>
	<ul id="picker-list"></ul>
	<div class="hint">OK: select&nbsp;&nbsp;RSK: back</div>
</div>

<div id="settings">
	<h1>Settings</h1>
	<ul id="settings-list"></ul>
	<div class="hint">OK: toggle&nbsp;&nbsp;RSK: back</div>
</div>

<div id="status">
	<div id="status-text">Loading...</div>
	<div class="bar"><div id="status-bar"></div></div>
</div>

<canvas id="canvas" width="240" height="320"></canvas>

<script src="module-init.js"></script>
<script src="app.js"></script>
</body>
</html>
