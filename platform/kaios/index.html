<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, height=320, initial-scale=1, user-scalable=no">
<title>Quake II</title>
<style>
	/* Bundled "QUAKE2" display font (Fonts2u, freeware) -- used for the
	 * main menu's logo and the selected-row cursor marker below, not for
	 * body text: its glyph set is uppercase-only display caps (plus
	 * digits/punctuation) except for one deliberate special case --
	 * lowercase 'q' alone is mapped to the stylized circular Quake mark,
	 * not a regular letterform, which is why the logo markup below
	 * spells the word with a lowercase q ("qUAKE") rather than an
	 * actual typo. */
	@font-face {
		font-family: 'Quake2';
		src: url('quake2.ttf');
	}
	html, body {
		margin: 0;
		padding: 0;
		width: 240px;
		height: 320px;
		background: #000;
		color: #fff;
		font-family: sans-serif;
		font-size: 13px;
		overflow: hidden;
	}
	#menu, #picker, #settings, #status {
		box-sizing: border-box;
		position: absolute;
		top: 0;
		left: 0;
		z-index: 10;
		width: 240px;
		height: 320px;
		padding: 8px;
		background: #000;
	}
	/* Quake II's actual menus are set entirely in one blocky all-caps
	 * display face, not a plain system sans mixed in next to it -- the
	 * bundled font only has uppercase letterforms anyway (see the
	 * @font-face comment above), so text-transform: uppercase here is
	 * what makes every label/value/hint in these three screens render
	 * in it at all instead of falling back to tofu for every lowercase
	 * letter it doesn't have. #status is deliberately excluded: it shows
	 * raw loading/error text (including caught exception messages this
	 * app doesn't control the content of), which needs to stay legible
	 * in a normal typeface no matter what characters end up in it. */
	#menu, #picker, #settings {
		font-family: 'Quake2', sans-serif;
		text-transform: uppercase;
	}
	#menu h1, #picker h1, #settings h1 {
		font-size: 15px;
		margin: 0 0 8px 0;
		color: #fff;
	}
	/* Main menu logo -- larger than the other two screens' plain
	 * h1 titles, with "II" picked out in the launcher's accent green to
	 * read as a logo mark rather than just another heading. */
	#menu h1 {
		font-size: 22px;
		letter-spacing: 1px;
	}
	#menu h1 .logo-ii {
		color: #3DAB67;
	}
	/* The parent's text-transform: uppercase above would otherwise turn
	 * this "q" into a capital Q -- the ordinary letterform, not the
	 * stylized mark it's deliberately lowercase to select (see the
	 * @font-face comment). Exempted here instead of leaving the whole
	 * logo out of the uppercase rule, so "UAKE II" still benefits from
	 * it like every other label in these three screens. */
	#menu h1 .logo-mark {
		text-transform: none;
	}
	#menu ul, #picker ul, #settings ul {
		list-style: none;
		margin: 0;
		padding: 0;
		/* Leaves room for the h1 above and the hint bar below within the
		 * fixed 320px-tall screen -- overflow-y lets a list longer than
		 * that (the Debug settings screen has 13+ rows) scroll instead
		 * of just clipping with no way to reach the rest via keyboard
		 * nav. Paired with li.selected's scrollIntoView() call in
		 * app.js's renderMenuItems(). */
		max-height: 250px;
		overflow-y: auto;
	}
	#menu li, #picker li, #settings li {
		padding: 4px 4px 4px 16px;
		position: relative;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	/* Quake II's own menu marks the selected row with a cursor glyph to
	 * its left and a distinct text color, not a solid highlight block --
	 * same idea here, in the same green as the "qUAKE II" logo mark
	 * (#3DAB67) instead of Quake II's yellow, with the cursor glyph
	 * itself set as the bundled display font's stylized Quake mark
	 * (mapped to lowercase 'q', see the @font-face comment above)
	 * instead of a plain triangle. */
	#menu li.selected, #picker li.selected, #settings li.selected {
		color: #3DAB67;
	}
	#menu li.selected::before, #picker li.selected::before, #settings li.selected::before {
		content: 'q';
		/* Same reasoning as .logo-mark above -- without this, the parent
		 * list's text-transform: uppercase turns this into a plain
		 * capital Q instead of the stylized mark lowercase 'q' selects. */
		text-transform: none;
		position: absolute;
		left: 1px;
		top: 2px;
		font-size: 11px;
		line-height: 1;
		color: #3DAB67;
	}
	/* Play before baseq2 has ever been found -- greyed out and
	   non-actionable (see app.js's showMainMenu()), with #menu-caption
	   underneath explaining why. */
	#menu li.disabled {
		color: #555;
	}
	#menu li.disabled.selected {
		color: #5c8a6d;
	}
	#menu li.disabled.selected::before {
		color: #5c8a6d;
	}
	#menu-caption {
		font-size: 11px;
		color: #888;
		padding: 2px 4px 0 16px;
		min-height: 13px;
	}
	/* Three equal-width flex columns so the hint bar mirrors the phone's
	 * own physical key layout -- left softkey / OK (center) / right
	 * softkey, left to right -- instead of running both hints together
	 * left-aligned. Each span gets its own text-align rather than
	 * relying on justify-content, so the center hint lands at the true
	 * center of the bar regardless of how long the left/right hints are
	 * (including empty, when a screen only uses one of the three). */
	#menu .hint, #picker .hint, #settings .hint, #status .hint {
		position: absolute;
		bottom: 6px;
		left: 8px;
		right: 8px;
		display: flex;
		font-size: 11px;
		color: #888;
	}
	#menu .hint > span, #picker .hint > span, #settings .hint > span, #status .hint > span {
		flex: 1;
	}
	#menu .hint > span:first-child, #picker .hint > span:first-child,
	#settings .hint > span:first-child, #status .hint > span:first-child {
		text-align: left;
	}
	#menu .hint > span:nth-child(2), #picker .hint > span:nth-child(2),
	#settings .hint > span:nth-child(2), #status .hint > span:nth-child(2) {
		text-align: center;
	}
	#menu .hint > span:last-child, #picker .hint > span:last-child,
	#settings .hint > span:last-child, #status .hint > span:last-child {
		text-align: right;
	}
	#picker, #settings, #status {
		display: none;
	}
	#status .bar {
		margin-top: 10px;
		height: 10px;
		border: 1px solid #666;
	}
	#status .bar > div {
		height: 100%;
		width: 0%;
		background: #35c;
	}
	#canvas {
		/* Always laid out (display:block from first paint), covered by
		 * #picker/#status sitting on top via z-index -- not toggled with
		 * display:none/block like those are. Matches this project's own
		 * ClassiCube KaiOS build (confirmed working WebGL on this exact
		 * device): its canvas is display:block from the start too, under
		 * a separate #loading-overlay div. A canvas that's never actually
		 * been laid out before WebGL context creation is plausible as a
		 * factor on this device's old Gecko engine, given how many other
		 * WebGL-specific quirks it's already shown this session. */
		display: block;
		position: absolute;
		top: 0;
		left: 0;
		width: 240px;
		height: 320px;
		background: #000;
	}
</style>
</head>
<body>

<div id="menu">
	<h1><span class="logo-mark">q</span>UAKE<span class="logo-ii"> II</span></h1>
	<ul id="menu-list"></ul>
	<div id="menu-caption"></div>
	<div class="hint"><span></span><span>OK</span><span></span></div>
</div>

<div id="picker">
	<h1>Select baseq2 folder</h1>
	<ul id="picker-list"></ul>
	<div class="hint"><span></span><span>OK</span><span>Back</span></div>
</div>

<div id="settings">
	<h1>Settings</h1>
	<ul id="settings-list"></ul>
	<div class="hint"><span></span><span>OK</span><span>Back</span></div>
</div>

<div id="status">
	<div id="status-text">Loading...</div>
	<div class="bar"><div id="status-bar"></div></div>
</div>

<canvas id="canvas" width="240" height="320"></canvas>

<script src="module-init.js"></script>
<script src="app.js"></script>
</body>
</html>
