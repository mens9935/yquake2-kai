<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, height=320, initial-scale=1, user-scalable=no">
<title>Quake II</title>
<style>
	html, body {
		margin: 0;
		padding: 0;
		width: 240px;
		height: 320px;
		background: #000;
		color: #ccc;
		font-family: sans-serif;
		font-size: 13px;
		overflow: hidden;
	}
	#picker, #status {
		box-sizing: border-box;
		position: absolute;
		top: 0;
		left: 0;
		z-index: 10;
		width: 240px;
		height: 320px;
		padding: 8px;
		background: #000;
	}
	#picker h1 {
		font-size: 15px;
		margin: 0 0 8px 0;
		color: #fff;
	}
	#picker ul {
		list-style: none;
		margin: 0;
		padding: 0;
	}
	#picker li {
		padding: 4px 4px;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	#picker li.selected {
		background: #35c;
		color: #fff;
	}
	#picker .hint, #status .hint {
		position: absolute;
		bottom: 6px;
		left: 8px;
		right: 8px;
		font-size: 11px;
		color: #888;
	}
	#status {
		display: none;
	}
	#status .bar {
		margin-top: 10px;
		height: 10px;
		border: 1px solid #666;
	}
	#status .bar > div {
		height: 100%;
		width: 0%;
		background: #35c;
	}
	#canvas {
		/* Always laid out (display:block from first paint), covered by
		 * #picker/#status sitting on top via z-index -- not toggled with
		 * display:none/block like those are. Matches this project's own
		 * ClassiCube KaiOS build (confirmed working WebGL on this exact
		 * device): its canvas is display:block from the start too, under
		 * a separate #loading-overlay div. A canvas that's never actually
		 * been laid out before WebGL context creation is plausible as a
		 * factor on this device's old Gecko engine, given how many other
		 * WebGL-specific quirks it's already shown this session. */
		display: block;
		position: absolute;
		top: 0;
		left: 0;
		width: 240px;
		height: 320px;
		background: #000;
	}
</style>
</head>
<body>

<div id="picker">
	<h1>Select baseq2 folder</h1>
	<ul id="picker-list"></ul>
	<div class="hint">OK: select&nbsp;&nbsp;RSK: rescan</div>
</div>

<div id="status">
	<div id="status-text">Loading...</div>
	<div class="bar"><div id="status-bar"></div></div>
</div>

<canvas id="canvas" width="240" height="320"></canvas>

<script src="module-init.js"></script>
<script src="app.js"></script>
</body>
</html>
