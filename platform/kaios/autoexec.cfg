// Fetched and written into the engine's virtual filesystem at runtime
// by the KaiOS shell (platform/kaios/app.js, writeAutoexec()) on every
// app launch -- edit this file directly and redeploy it on its own, no
// engine rebuild needed. Writes over whatever default.cfg/config.cfg
// set up so the fixed KaiOS keypad has a deterministic, complete
// control scheme:
//
//   DPAD              -> movement (forward/back/turn left/turn right)
//   Right Soft Key     -> ESC (menu) -- handled by the engine itself,
//                          K_ESCAPE can't be rebound, no bind needed here
//   OK / center key    -> Enter, remapped here to fire
//   Left Soft Key      -> look up
//   Call               -> look down
//   #                  -> jump
//   *                  -> crouch
//   1-0                -> weapon select (same layout as stock Quake II)

unbindall

bind UPARROW    "+forward"
bind DOWNARROW  "+back"
bind LEFTARROW  "+left"
bind RIGHTARROW "+right"

bind ENTER "+attack"

bind F1 "+lookup"
bind F2 "+lookdown"
bind F3 "+moveup"
bind F4 "+movedown"

bind 1 "use Blaster"
bind 2 "use Shotgun"
bind 3 "use Super Shotgun"
bind 4 "use Machinegun"
bind 5 "use Chaingun"
bind 6 "use Grenade Launcher"
bind 7 "use Rocket Launcher"
bind 8 "use HyperBlaster"
bind 9 "use Railgun"
bind 0 "use BFG10K"

// Native 240x320 for now -- reverted from a 176x220 render-scale
// experiment to keep today's benchmark runs (KAIOS_STATS console log)
// isolated to one variable at a time. The render buffer can be set
// below the canvas's own 240x320 for free (Emscripten's SDL2 port only
// ever touches the buffer's canvas.width/height attributes, never
// index.html's fixed CSS box size, so the browser stretches a smaller
// buffer to fill the screen with no extra code) -- 176x220 is ~33%
// fewer pixels for the software rasterizer to fill each frame, worth
// retrying once there is a clean native-resolution baseline to compare
// against.
set r_mode -1
set r_customwidth 240
set r_customheight 320

// gl1 shelved for now: 6 different evidenced fixes to
// emscripten_webgl_create_context() all failed identically (getContext
// returns null, browser fires no error event at all -- no more
// diagnostic room without real devtools access). Software renderer.
//
// r_demopattern confirmed the display pipeline itself is solid (real,
// moving, non-text content on screen, hundreds of frames, zero issues)
// -- turned back off now so RE_RenderFrame goes through the real
// R_ScanEdges path again. This device is confirmed slow (map load
// alone takes ~20-25s), so a quiet console for a while after printing
// about to R_ScanEdges doesn't necessarily mean a hang -- give it real
// time before concluding anything.
//
// NOTE: this is the second time a literal double quote character
// inside a slash-slash comment in this file has broken parsing below
// it (Line has unmatched quote, discarded, then an unrelated word
// further down misread as an unknown command) -- this tokenizer is
// not comment-aware when scanning for a matching close quote, it does
// not stop at the comment marker. A semicolon character inside a
// comment breaks it the same way (confirmed separately, twice, from
// two different comments that each had one): whatever splits the
// buffer into individual statements treats a semicolon as a statement
// separator even inside a comment, so the words after it on the same
// line stop being part of the comment and get parsed as a real
// command instead. Do not put a double quote character or a semicolon
// character in a comment anywhere in this file, ever, including in
// future edits -- spell out the word and or then instead of using a
// semicolon there.
set vid_renderer soft
set vid_fullscreen 0
set r_demopattern 0

// Explicit default: r_vsync is CVAR_ARCHIVE, so whatever got typed at
// the in-game console earlier tonight (r_vsync 0, most likely, chasing
// something else) would otherwise persist forever via config.cfg
// (platform/kaios/app.js now saves that across launches). Force it
// back to 1 here on every boot regardless of what got saved. Note this
// does not control real vsync on this platform at all -- see
// RE_IsVsyncActive/RE_InitContext in sw_main.c, Emscripten's SDL2 port
// bypasses SDL_CreateRenderer (and therefore SDL_RENDERER_PRESENTVSYNC)
// entirely here -- it only changes which target framerate
// Qcommon_Frame (frame.c) paces the client/packet loop against.
set r_vsync 1

// cl_lights (dynamic per-frame relighting), cl_particles, and
// r_distcull_dist (draw-distance cull, sw_bsp.c/sw_main.c) all USED to
// be forced here with a `set`. Moved to being the cvars' own defaults
// instead (cl_main.c for the first two, sw_main.c for the third), all
// now CVAR_ARCHIVE and all now live-adjustable from the in-game KaiOS
// Tuning options menu (menu.c) -- a `set` here would run *after*
// config.cfg on every boot (Qcommon_ExecConfigs, frame.c) and silently
// stomp back over whatever the player picked from that menu on their
// very next launch. See sw_main.c's r_distcull_dist registration
// comment for the tuning history (2048 did nothing on demo1.dm2's
// indoor maps, 400 worked but was too aggressive, 1200 is the shipped
// default) and cl_main.c's cl_lights/cl_particles comment for why
// they're off by default here specifically.

// s_khz: same reasoning -- moved off a forced `set 44` now that it's
// adjustable from the same KaiOS Tuning menu. Still defaults to 44
// (sdl.c) -- confirmed the one rate that's sounded clean all session,
// see sdl.c's SDL_BackendInit comment for the fuller story on why 22
// caused audible glitches.

// s_kaios_skip_prefixes is CVAR_ARCHIVE, so whatever list got saved by
// an older build's default (sound.c, S_Init) would otherwise stick
// around forever in the persisted config -- force today's list here
// too. Adds misc/talk on top of the earlier world/doors/plats/switches
// set: that prefix matches misc/talk.wav and misc/talk1.wav, the
// notify beep every target_help/trigger message (including the
// computer terminal updated message) plays through, per g_target.c
// and g_trigger.c. A map's own radio/speaker voiceover line (a
// target_speaker entity's noise key, set inside the bsp itself, not
// in engine source) is not covered by a fixed name here -- watch the
// console for S_LoadSound freshly loaded and its exact path, then add
// that path or folder to the list below.
set s_kaios_skip_prefixes "world/ doors/ plats/ switches/ misc/talk"

// Sound back on: the OOM crash traced to stale sound/image/model
// caches from previous levels never actually getting evicted (a
// slot-count heuristic that never trips on this build's small heap,
// see Mod_HasFreeSpace/R_ImageHasFreeSpace/S_HasFreeSpace) rather than
// to sound itself being fundamentally too expensive to keep. Testing
// that fix now with sound back on instead of living without audio
// permanently. Set back to 0 if this still runs out of memory.
set s_initsound 1

set cl_run 1
set sensitivity 0

// Vanilla default.cfg (shipped inside the game's own pak0.pak, not
// something we control) sets up the classic id Software attract mode:
// nextdemo defaults to d1 (intro cinematic + demo loop), and every
// time the engine spawns even a blank placeholder map it copies
// nextdemo into nextserver, which then auto-executes on its own via
// SV_Nextserver -- independent of and in addition to the engine's own
// d1 auto-start on first boot. Neither the intro cinematic nor the
// demo file are guaranteed to exist in a given baseq2 install (and
// nobody wants to watch one on a phone anyway), so break the chain at
// its root: with nextserver empty, SV_Nextserver just runs killserver
// instead of trying to load anything.
//
// NOTE: literal double quotes AND semicolons inside comments in this
// file have both broken cvar parsing below before (see the longer
// note above, by r_demopattern) -- keep comments free of both.
set nextdemo ""
set nextserver ""

// Don't auto-load anything on boot -- no demo1.dm2 benchmark loop, no
// map. kaios_startcmd empty means the block in Qcommon_Frame (frame.c)
// that would otherwise Cbuf_AddText() it just never fires. The player
// lands on whatever the engine's own disconnected state is (console
// or black screen). Right Soft Key (ESC, bound below) opens the main
// menu from there same as it does anywhere else, so New Game etc. is
// still reachable, just not automatic.
//
// This is set as a cvar, not issued directly here, because a literal
// map/demomap command in this file is silently discarded: autoexec.cfg
// execs before SV_Init() registers those commands (see kaios_startcmd,
// frame.c) -- confirmed against a real device's console log showing
// Unknown command demomap/map. Cvar_Set() has no such ordering
// dependency.
//
// To auto-start something again: change this to e.g.
// set kaios_startcmd map base1
set kaios_startcmd ""

// kaios_mapcycle soak test (40-map full-campaign auto-cycle, see
// Qcommon_Frame in frame.c) is done with for now -- back to normal
// single-demo playback above. Leaving the mechanism itself in the
// engine, it stays inert unless kaios_mapcycle is set to a non-empty
// list again -- set that cvar and kaios_mapcycle_interval at the
// console or here to bring it back for another soak run.
