// Generated by the KaiOS shell (platform/kaios/app.js) before the engine
// boots. Writes over whatever default.cfg/config.cfg set up so the fixed
// KaiOS keypad has a deterministic, complete control scheme:
//
//   DPAD              -> movement (forward/back/turn left/turn right)
//   Right Soft Key     -> ESC (menu) -- handled by the engine itself,
//                          K_ESCAPE can't be rebound, no bind needed here
//   OK / center key    -> Enter, remapped here to fire
//   Left Soft Key      -> look up
//   Call               -> look down
//   #                  -> jump
//   *                  -> crouch
//   1-0                -> weapon select (same layout as stock Quake II)

unbindall

bind UPARROW    "+forward"
bind DOWNARROW  "+back"
bind LEFTARROW  "+left"
bind RIGHTARROW "+right"

bind ENTER "+attack"

bind F1 "+lookup"
bind F2 "+lookdown"
bind F3 "+moveup"
bind F4 "+movedown"

bind 1 "use Blaster"
bind 2 "use Shotgun"
bind 3 "use Super Shotgun"
bind 4 "use Machinegun"
bind 5 "use Chaingun"
bind 6 "use Grenade Launcher"
bind 7 "use Rocket Launcher"
bind 8 "use HyperBlaster"
bind 9 "use Railgun"
bind 0 "use BFG10K"

set r_mode -1
set r_customwidth 240
set r_customheight 320
set vid_renderer soft
set vid_fullscreen 0

// Sound off for now: this device is CPU/stack constrained enough that
// even edge cases in the software rasterizer alone were enough to hang
// it, and other constrained ports (e.g. pelya's Android Doom) have had
// to drop audio under similar pressure. Revisit once rendering is
// solid and there's headroom to spend on it.
set s_initsound 0

set cl_run 1
set sensitivity 0

// Vanilla default.cfg (shipped inside the game's own pak0.pak, not
// something we control) sets up the classic id Software attract mode:
// nextdemo defaults to d1 (intro cinematic + demo loop), and every
// time the engine spawns even a blank placeholder map it copies
// nextdemo into nextserver, which then auto-executes on its own via
// SV_Nextserver -- independent of and in addition to the engine's own
// d1 auto-start on first boot. Neither the intro cinematic nor the
// demo file are guaranteed to exist in a given baseq2 install (and
// nobody wants to watch one on a phone anyway), so break the chain at
// its root: with nextserver empty, SV_Nextserver just runs killserver
// instead of trying to load anything.
//
// NOTE: literal double quotes inside comments in this file have
// broken cvar parsing below before (the parser isn't comment-aware
// when it scans for matching quotes) -- keep comments quote-free.
set nextdemo ""
set nextserver ""
